<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MessageBoard</title>
  <script src="https://cdn.ethers.io/lib/ethers-5.7.2.umd.min.js"></script>
  <style>
    body { font-family: sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
    button { padding: 8px 14px; margin-top: 8px; cursor: pointer; }
    input { padding: 8px; width: 100%; box-sizing: border-box; margin-top: 8px; }
    #message { font-size: 1.2em; padding: 12px; background: #f3f3f3; border-radius: 6px; min-height: 1.5em; }
    #status { margin-top: 12px; min-height: 1.5em; }
    .error { color: #b00020; }
    .ok { color: #1b7f3b; }
  </style>
</head>
<body>
  <h1>MessageBoard</h1>

  <button id="connectBtn">Connect Wallet</button>
  <div id="account"></div>

  <h3>Current message</h3>
  <div id="message">Loading...</div>

  <h3>Set a new message</h3>
  <input id="messageInput" type="text" placeholder="Type a message" />
  <button id="setBtn" disabled>Set Message</button>

  <div id="status"></div>

  <script>
    const CONTRACT_ADDRESS = "0x5FbDB2315678afecb367f032d93F642f64180aa3";
    const ABI = [
      "function getMessage() view returns (string)",
      "function setMessage(string newMessage)"
    ];
    const LOCAL_CHAIN_ID = 31337;

    const messageEl = document.getElementById("message");
    const statusEl = document.getElementById("status");
    const accountEl = document.getElementById("account");
    const setBtn = document.getElementById("setBtn");
    const inputEl = document.getElementById("messageInput");

    let signerContract = null;

    function showStatus(text, cls) {
      statusEl.textContent = text;
      statusEl.className = cls || "";
    }

    // Reads work without a wallet: talk to the node directly
    async function loadMessage() {
      try {
        const provider = new ethers.providers.JsonRpcProvider("http://127.0.0.1:8545");
        const contract = new ethers.Contract(CONTRACT_ADDRESS, ABI, provider);
        messageEl.textContent = (await contract.getMessage()) || "(empty)";
      } catch (err) {
        messageEl.textContent = "Could not read the contract.";
        showStatus("Is `npx hardhat node` running, and is the address correct?", "error");
      }
    }

    async function connectWallet() {
      if (!window.ethereum) {
        showStatus("MetaMask not found. Install it first.", "error");
        return;
      }
      try {
        const provider = new ethers.providers.Web3Provider(window.ethereum);
        await provider.send("eth_requestAccounts", []);

        const network = await provider.getNetwork();
        if (network.chainId !== LOCAL_CHAIN_ID) {
          showStatus("Wrong network. Switch MetaMask to Localhost 8545 (Chain ID 31337).", "error");
          return;
        }

        const signer = provider.getSigner();
        accountEl.textContent = "Connected: " + (await signer.getAddress());
        signerContract = new ethers.Contract(CONTRACT_ADDRESS, ABI, signer);
        setBtn.disabled = false;
        showStatus("Wallet connected.", "ok");
      } catch (err) {
        if (err.code === 4001) {
          showStatus("Connection request was rejected in MetaMask.", "error");
        } else {
          showStatus("Could not connect: " + (err.message || err), "error");
        }
      }
    }

    async function setMessage() {
      const text = inputEl.value.trim();
      if (!text) {
        showStatus("Type a message first.", "error");
        return;
      }
      try {
        setBtn.disabled = true;
        showStatus("Waiting for you to confirm in MetaMask...");
        const tx = await signerContract.setMessage(text);
        showStatus("Transaction sent. Waiting for confirmation...");
        await tx.wait();
        await loadMessage();
        inputEl.value = "";
        showStatus("Message updated.", "ok");
      } catch (err) {
        if (err.code === 4001 || err.code === "ACTION_REJECTED") {
          showStatus("You cancelled the transaction in MetaMask.", "error");
        } else {
          showStatus("Transaction failed: " + (err.reason || err.message || err), "error");
        }
      } finally {
        setBtn.disabled = false;
      }
    }

    document.getElementById("connectBtn").addEventListener("click", connectWallet);
    setBtn.addEventListener("click", setMessage);
    loadMessage();
  </script>
</body>
</html>
